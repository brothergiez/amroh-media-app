services:
  mongodb:
    image: mongo:7
    container_name: amroh-mongodb
    restart: unless-stopped
    ports:
      - "27017:27017"
    volumes:
      - amroh-mongo-data:/data/db
    environment:
      MONGO_INITDB_DATABASE: amroh
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

volumes:
  amroh-mongo-data:
